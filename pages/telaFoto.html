<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de análise da foto</title>
    <link rel="stylesheet" href="../styles/telaFoto.css">
    <script src="../scripts/telaFoto.js" defer></script>
</head>
<body>
    <header>
        <img src="../images/user.png" alt="">
        <h1>Cristina Soares</h1>
    </header>
    <main>
        <section class="um">
            <h2>Restrições selecionadas:</h2>
            <div id="restricoesSelecionadas">

            </div>
            <a href="../index.html" id="editarRestricoes">Editar restrições</a>
        </section>
        <section class="dois">
            <h2>Análise</h2>
            <input type="text" placeholder="Digite o nome do produto..." id="">
            <label for="imagem">Selecione uma imagem</label>
            <input type="file" id="imagem" accept="image/*" capture="environment">
            <img id="preview" alt="imagem selecionada">
        </section>
        <section class="tres">
            <a href="./telaResultado.html">Digitar lista (em desenvolvimento)</a>
            <a href="../pages/telaResultado.html" id="analisarImagem">Analisar imagem</a>
        </section>
    </main>
</body>
</html>

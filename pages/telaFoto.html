<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de análise da foto</title>
    <link rel="stylesheet" href="../styles/telaFoto.css">
    <script src="../scripts/telaFoto.js" defer></script>
</head>
<body>
    <header>
        <img src="../images/user.png" alt="">
        <h1>Cristina Soares</h1>
    </header>
    <main>
        <section class="um">
            <h2>Restrições selecionadas:</h2>
            <div>
                <div>Glúten</div>
                <div>Lactose</div>
            </div>
            <button>Editar restrições</button>
        </section>
        <section class="dois">
            <h2>Análise</h2>
            <label for="imagem">Selecione uma imagem:</label>
            <input type="file" id="imagem" accept="image/*">
            <img id="preview" alt="imagem selecionada">
        </section>
        <section class="tres">
            <button>Digitar lista (em desenvolvimento)</button>
            <button>Analisar imagem</button>
        </section>
    </main>
</body>
</html>
